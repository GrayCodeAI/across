name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -o "dist/across${ext}" ./cmd/across
          for agent in claude-code codex cursor gemini opencode qwen factory-droid amp goose; do
            go build -trimpath -o "dist/across-agent-${agent}${ext}" "./cmd/across-agent-${agent}"
          done
          sha256sum dist/* > dist/SHA256SUMS
          go list -m -json all > dist/go-modules.json
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: across-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: across-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
